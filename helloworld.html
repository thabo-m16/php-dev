<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>Hello World</title>
    </head>
    <body>
        <h1>WELCOME TO HTML5</h1>
        <hr>
        <p>HTML5 <em>is not</em> so hard to learn!</p>
        <p>Soon you will &hearts; using HTML.</p>
        <p>You can put lots of text here if you want.
           We could go on and on with fake text for you
           to read, but let's get back to the book.</p>
    </body>
</html>

<!-- (html, head, body)  tag pairs are used to specify the general structure
of the document.-->

<!-- (title) tag pair specifies the title of the document, which
generally appears in the title bar of the Web browser.-->

<!--(em) is used to emphasize text, typically rendering it in italics-->

<!--(hr) is used to create a horizontal rule (line) in the document-->

<!--(p) is used to create a paragraph in the document-->

<!--(meta) is used to provide metadata about the HTML document, such as the character encoding.-->

<!--(!DOCTYPE html) is used to specify the HTML5 doctype declaration -->

<!--(h1) is used to create a top-level heading in the document-->
